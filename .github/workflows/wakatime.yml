# Secrets (either name works for the WakaTime key):
#   WAKATIME_API_KEY  or  WAKA_TIME_API_KEY  -> https://wakatime.com/settings/api-key
#   GH_TOKEN  (optional) -> PAT with Contents write; falls back to GITHUB_TOKEN
name: Update WakaTime Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-wakatime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update README with WakaTime stats
        uses: athul/waka-readme@370590ad8da8f54282ed92aa42b7c25ecbd5a9a6
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY || secrets.WAKA_TIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          SHOW_TITLE: "true"
          SHOW_TIME: "true"
          BLOCKS: "░▒▓█"
          TIME_RANGE: all_time
          LANG_COUNT: 10
          SHOW_TOTAL: "true"
