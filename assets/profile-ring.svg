<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa">
        <animate attributeName="stop-color" values="#00d4aa;#7c3aed;#00d4aa" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#00d4aa;#7c3aed" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00d4aa">
        <animate attributeName="stop-color" values="#00d4aa;#7c3aed;#00d4aa" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="130" cy="130" r="118" fill="none" stroke="url(#ring)" stroke-width="6" filter="url(#glow)" opacity="0.35">
    <animate attributeName="r" values="116;120;116" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.55;0.25" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="130" cy="130" r="112" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="18 10">
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="12s" repeatCount="indefinite"/>
  </circle>

  <circle cx="130" cy="130" r="104" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;40" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="6 6;12 6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
